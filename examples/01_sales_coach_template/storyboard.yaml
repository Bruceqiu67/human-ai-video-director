# ==============================================================================
# 案例一：《好帮手AI话术私教》完整商业宣传片分镜剧本 (24句完整交付版)
# ==============================================================================
# 本剧本为《好帮手AI话术私教》终极交付大片的 1:1 完整母版。
# 全片共 5 幕、24 句台词，总时长 64.6 秒，处于黄金短视频完播区间。
# ==============================================================================

project:
  name: "haobangshou_sales_coach"
  title: "好帮手AI学习助手 · 话术私教 (完整版)"
  resolution: [1080, 1920]
  fps: 30
  style_preset: "journal_scrapbook"
  audio:
    voice: "zh-CN-YunxiNeural"      # 微软官方阳光亲和青年男声
    rate: "+18%"                    # 恒定稳健自然语速 (0% atempo 逐句拉伸)
    bgm_volume_active: 0.12         # 人声讲话时 BGM 压低音量
    bgm_volume_idle: 0.24           # 气口停顿时 BGM 回弹音量

scenes:
  # ----------------------------------------------------------------------------
  # Act 1: 痛点觉醒 (Hook) —— 突发冲突、共情暴击、打破平衡 (4句 · 10.92s)
  # ----------------------------------------------------------------------------
  - id: "scene_01"
    stage_tag: "STAGE 01 // 痛点觉醒"
    headline: "刚开口，就被客户秒挂？"
    transition:
      type: "none"
    dialogue_segments:
      - id: "s1_1"
        text: "刚开口，就被客户秒挂！"
        pose: "手持电话"
        fx: ["warning_badge_shake"]
      - id: "s1_2"
        text: "面对客户的‘现在忙、不需要’，大脑一片空白不知如何回复。"
        pose: "愁眉苦脸看手机"
        fx: []
      - id: "s1_3"
        text: "新人缺乏异议经验，根本留不住客户，"
        pose: "捏鼻梁揉眉心"
        fx: []
      - id: "s1_4"
        text: "导致开单率怎么也上不去。"
        pose: "扶额叹气"
        fx: ["camera_push"]
    timing:
      initial_delay: 0.00
      pause_between: 0.28
      tail_pad: 0.40

  # ----------------------------------------------------------------------------
  # Act 2: 破局重构 (Solution) —— 心理减负、引入主角、全景地图 (5句 · 14.74s)
  # ----------------------------------------------------------------------------
  - id: "scene_02"
    stage_tag: "STAGE 02 // 破局重构"
    headline: "别担心，只是你练少了！"
    transition:
      type: "page_flip"
      duration: 0.65
    dialogue_segments:
      - id: "s2_1"
        text: "别担心，只是你练少了！"
        pose: "主管没空教"
        fx: []
      - id: "s2_2"
        text: "找不到人随时陪练、怕拿客户试错？"
        pose: "合规修补"
        fx: []
      - id: "s2_3"
        text: "好帮手 AI 学习助手重磅上线——话术私教！"
        pose: "重磅上线"
        fx: ["highlighter_sweep"]
      - id: "s2_4"
        text: "从开场白、报价到促成，24 关实战异议地图，"
        pose: "食指点划"
        fx: []
      - id: "s2_5"
        text: "随时随地像打游戏一样刷满肌肉记忆。"
        pose: "握拳打满"
        fx: []
    timing:
      initial_delay: 0.00
      pause_between: 0.28
      tail_pad: 0.50

  # ----------------------------------------------------------------------------
  # Act 3: 拟真对攻 (Simulation) —— 极客对决、深度体验、零险排雷 (3句 · 13.09s)
  # ----------------------------------------------------------------------------
  - id: "scene_03"
    stage_tag: "STAGE 03 // 拟真对攻"
    headline: "拟真对攻，零风险高压排雷"
    transition:
      type: "page_flip"
      duration: 0.65
    dialogue_segments:
      - id: "s3_1"
        text: "点击挑战，你的对手比真实客户更挑剔！"
        pose: "食指指点"
        fx: ["click_pulse"]
      - id: "s3_2"
        text: "AI 瞬间化身各种刁钻性格的客户，逼真模拟高压通话。"
        pose: "扶眼镜吃惊"
        fx: ["waveform_equalizer"]
      - id: "s3_3"
        text: "在零风险的安全屋里，把所有怯场和大脑空白，在正式开单前全部排雷！"
        pose: "双手抱胸"
        fx: ["stamp_impact"]
    timing:
      initial_delay: 0.00
      pause_between: 0.35
      tail_pad: 0.50

  # ----------------------------------------------------------------------------
  # Act 4: 深度诊断 (Insight) —— 残暴打分、颠覆认知、干货解法 (7句 · 16.29s)
  # ----------------------------------------------------------------------------
  - id: "scene_04"
    stage_tag: "STAGE 04 // 深度诊断"
    headline: "第一次只有45分？"
    transition:
      type: "page_flip"
      duration: 0.65
    dialogue_segments:
      - id: "s4_1"
        text: "一通练完，AI立刻输出深度体检单！"
        pose: "耸肩错愕"
        fx: []
      - id: "s4_2"
        text: "第一次只有45分？"
        pose: "耸肩错愕"
        fx: ["score_stamp_impact"]
      - id: "s4_3"
        text: "别慌，它给的可不是泛泛的加油，"
        pose: "托腮思考"
        fx: []
      - id: "s4_4"
        text: "而是指骨到肉的解法："
        pose: "托腮思考"
        fx: []
      - id: "s4_5"
        text: "开场白太冗长？直接教你‘数据支撑’——"
        pose: "托腮思考"
        fx: ["highlighter_sweep"]
      - id: "s4_6"
        text: "第一句话抛出‘90%同到期车主已办理’，"
        pose: "OK自信"
        fx: []
      - id: "s4_7"
        text: "一秒锁死客户注意力！"
        pose: "OK自信"
        fx: []
    timing:
      initial_delay: 0.00
      pause_between: 0.30
      tail_pad: 0.50

  # ----------------------------------------------------------------------------
  # Act 5: 通关号召 (CTA) —— 终极爽感、能力升华、立即行动 (5句 · 9.46s)
  # ----------------------------------------------------------------------------
  - id: "scene_05"
    stage_tag: "STAGE 05 // 通关升华"
    headline: "打开好帮手，开启销冠之旅"
    transition:
      type: "page_flip"
      duration: 0.65
    dialogue_segments:
      - id: "s5_1"
        text: "哪里卡壳，就一键“再练一次”，"
        pose: "握拳蓄力"
        fx: []
      - id: "s5_2"
        text: "直到把金牌话术化作你的本能应变。"
        pose: "握拳蓄力"
        fx: []
      - id: "s5_3"
        text: "现在就打开好帮手 APP，"
        pose: "开掌邀请"
        fx: []
      - id: "s5_4"
        text: "进入【话术私教】，"
        pose: "开掌邀请"
        fx: []
      - id: "s5_5"
        text: "开启你的销冠通关之旅吧！"
        pose: "点赞通关"
        fx: ["gold_light_sweep"]
    timing:
      initial_delay: 0.00
      pause_between: 0.25
      tail_pad: 0.60
